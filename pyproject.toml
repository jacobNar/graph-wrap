[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graph-abstract"
dynamic = ["version"]
description = "A wrapper for LangGraph agents that handles observability, memory, and guardrails"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jacob Narayan", email = "jacobnarayan1998@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "langgraph",
    "langgraph-checkpoint-postgres",
    "psycopg[binary]"
]

[project.optional-dependencies]
ui = [
    "streamlit"
]

[project.urls]
Homepage = "https://github.com/jacobNar/graph-abstract"
Issues = "https://github.com/jacobNar/graph-abstract/issues"

[project.scripts]
graph-abstract-ui = "graph_abstract.cli:main"


[tool.hatch.version]
path = "src/graph_abstract/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_abstract"]
